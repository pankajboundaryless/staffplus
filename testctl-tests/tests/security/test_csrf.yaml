test_case: security_csrf_protection_enforced
module: security
auth:
  role: admin

steps:
  - action: POST
    path: /time/store
    body:
      project_id: "14"
      hours:      "8"
    omit_csrf: true
    expect_status: 302   # app redirects on CSRF failure (not 419 — that's Laravel default)
    # note: 302 is the app's CSRF failure behaviour; data must NOT be stored
