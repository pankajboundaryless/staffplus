test_case: security_xss_in_person_fields
module: security
auth:
  role: admin

steps:
  - action: GET
    path: /people/new
    expect_status: 200

  - action: POST
    path: /people/new
    body:
      first_name: "<script>alert('xss')</script>"
      last_name:  "XssTest"
      email:      "xss-test@testctl.local"
      status:     "active"
    follow_redirect: true
    expect_status: 200
    validations:
      - type: text
        value: "<script>alert('xss')</script>"
        negate: true

validations:
  - source: database
    table: people
    lookup:
      tenant_id: 1
      email:     "xss-test@testctl.local"
    order_by: id DESC

teardown_sql:
  - "DELETE FROM people WHERE tenant_id = 1 AND email = 'xss-test@testctl.local'"
