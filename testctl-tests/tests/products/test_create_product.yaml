test_case: products_create_product
module: products
auth:
  role: admin

steps:
  - action: GET
    path: /products/new
    expect_status: 200

  - action: POST
    path: /products/new
    body:
      name:  "Testctl Product"
      price: "100"
    expect_status: 200   # app responds 200+HTML, not PRG redirect

teardown_sql:
  - "DELETE FROM products WHERE name = 'Testctl Product' AND tenant_id = 1"
