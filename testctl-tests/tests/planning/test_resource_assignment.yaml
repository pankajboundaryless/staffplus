test_case: planning_create_assignment
module: planning
auth:
  role: admin

setup_sql:
  - "INSERT IGNORE INTO projects (id, tenant_id, name, status, type, created_at) VALUES (99004, 1, 'Testctl Planning Project', 'active', 'billable', NOW())"

steps:
  - action: GET
    path: /planning
    expect_status: 200
    extract:
      - name: first_person_id
        selector: "select[name='person_id'] option:not([value=''])"
        attribute: value

  - action: POST
    path: /planning/assign
    body:
      project_id:     "99004"
      person_id:      "{{ first_person_id }}"
      start_date:     "2026-06-01"
      end_date:       "2026-06-30"
      allocation_pct: "100"
    expect_status: 302

validations:
  - source: database
    table: resource_plan_assignments
    lookup:
      tenant_id:  1
      project_id: 99004
    order_by: id DESC
    expect:
      status:         draft
      allocation_pct: "100.00"

teardown_sql:
  - "DELETE FROM project_members WHERE project_id = 99004"
  - "DELETE FROM approval_steps WHERE approval_request_id IN (SELECT id FROM approval_requests WHERE entity_type = 'resource_plan' AND tenant_id = 1 AND created_at > DATE_SUB(NOW(), INTERVAL 1 HOUR))"
  - "DELETE FROM approval_requests WHERE entity_type = 'resource_plan' AND tenant_id = 1 AND created_at > DATE_SUB(NOW(), INTERVAL 1 HOUR)"
  - "DELETE FROM resource_plan_assignments WHERE project_id = 99004"
  - "DELETE FROM projects WHERE id = 99004"
