test_case: planning_overallocation_blocked
module: planning
auth:
  role: admin

steps:
  - action: GET
    path: /planning
    expect_status: 200

  - action: POST
    path: /planning/assign
    body:
      person_id:      "1"
      project_id:     "14"
      start_date:     "2026-06-01"
      end_date:       "2026-08-31"
      allocation_pct: "100"
    expect_status: 200

  - action: POST
    path: /planning/assign
    body:
      person_id:      "1"
      project_id:     "14"
      start_date:     "2026-06-01"
      end_date:       "2026-08-31"
      allocation_pct: "100"
    expect_status: 200   # over-allocation: app returns 200+error message, not 422

teardown_sql:
  - "DELETE FROM project_assignments WHERE project_id = 14 AND created_at > DATE_SUB(NOW(), INTERVAL 1 HOUR)"
