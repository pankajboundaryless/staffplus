test_case: planning_absence_conflict_warning
module: planning
auth:
  role: admin

steps:
  - action: GET
    path: /planning
    expect_status: 200

  - action: POST
    path: /planning/assign
    body:
      person_id:      "1"
      project_id:     "14"
      start_date:     "2026-07-01"
      end_date:       "2026-07-31"
      allocation_pct: "100"
    expect_status: 200   # app responds 200+HTML, not PRG redirect

teardown_sql:
  - "DELETE FROM project_assignments WHERE project_id = 14 AND created_at > DATE_SUB(NOW(), INTERVAL 1 HOUR)"
