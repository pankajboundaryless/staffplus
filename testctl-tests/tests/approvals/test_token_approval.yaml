test_case: approvals_token_deeplink_respond
module: approvals
# No auth block — token-based approval is intentionally unauthenticated (used in emails).

setup_sql:
  - >
    INSERT IGNORE INTO approval_requests
    (id, tenant_id, entity_type, entity_id, status, token, created_at)
    VALUES (99901, 1, 'timesheet', 99801, 'pending', 'testctl-req-token-abc123', NOW())
  - >
    INSERT IGNORE INTO approval_steps
    (id, approval_request_id, tenant_id, step_order, status, token, created_at)
    VALUES (99901, 99901, 1, 1, 'pending', 'testctl-step-token-xyz789', NOW())

steps:
  - action: GET
    path: /approvals/respond?token=testctl-step-token-xyz789&action=approve
    follow_redirect: false
    expect_status: 302

validations:
  - source: database
    table: approval_steps
    lookup:
      id: 99901
    expect:
      status: approved

teardown_sql:
  - "DELETE FROM approval_steps WHERE id = 99901"
  - "DELETE FROM approval_requests WHERE id = 99901"
