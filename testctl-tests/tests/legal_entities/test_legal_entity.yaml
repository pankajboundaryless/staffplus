test_case: legal_entities_create_entity
module: legal_entities
auth:
  role: admin

steps:
  - action: GET
    path: /legal-entities/new
    expect_status: 200

  - action: POST
    path: /legal-entities/new
    body:
      name:    "Testctl Legal Entity"
      country: "GB"
    expect_status: 200   # app responds 200+HTML, not PRG redirect

teardown_sql:
  - "DELETE FROM legal_entities WHERE name = 'Testctl Legal Entity' AND tenant_id = 1"
