test_case: tasks_create_board_and_task
module: tasks
auth:
  role: admin

steps:
  - action: GET
    path: /tasks
    expect_status: 200

  - action: POST
    path: /tasks/task/new
    body:
      title:      "Testctl Task"
      project_id: "14"
    expect_status: 200   # app responds 200+HTML, not PRG redirect

teardown_sql:
  - "DELETE FROM tasks WHERE title = 'Testctl Task' AND tenant_id = 1"
