test_case: auth_employee_cannot_access_admin
module: auth
auth:
  role: employee

steps:
  - action: GET
    path: /admin/roles
    follow_redirect: false
    expect_status: 302     # app redirects employees away (302), not 403 flat denial

  - action: GET
    path: /admin/settings
    follow_redirect: false
    expect_status: 302     # same — redirect is the app's access-control mechanism
