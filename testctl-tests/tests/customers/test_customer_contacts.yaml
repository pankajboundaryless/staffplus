test_case: customers_add_contact
module: customers
auth:
  role: admin

setup_sql:
  - "INSERT IGNORE INTO customers (id, tenant_id, name) VALUES (99801, 1, 'Testctl Contact Customer')"

steps:
  - action: POST
    path: /customers/99801/contact
    body:
      name:  "Test Contact"
      email: "contact@testctl.test"
    expect_status: 200   # app responds 200+HTML, not PRG redirect

teardown_sql:
  - "DELETE FROM customer_contacts WHERE customer_id = 99801"
  - "DELETE FROM customers WHERE id = 99801"
