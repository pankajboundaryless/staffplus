test_case: customers_create_customer
module: customers
auth:
  role: admin

steps:
  - action: GET
    path: /customers/new
    expect_status: 200

  - action: POST
    path: /customers/new
    body:
      name:               "Testctl Test Customer"
      short_name:         "TTC"
      type:               "customer"
      currency:           "CHF"
      payment_terms_days: "30"
    expect_status: 302

validations:
  - source: database
    table: customers
    lookup:
      tenant_id: 1
      name:      "Testctl Test Customer"
    expect:
      status: active

teardown_sql:
  - "DELETE FROM customer_billing_profiles WHERE customer_id IN (SELECT id FROM customers WHERE tenant_id = 1 AND name = 'Testctl Test Customer')"
  - "DELETE FROM customers WHERE tenant_id = 1 AND name = 'Testctl Test Customer'"
