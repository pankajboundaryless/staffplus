test_case: customers_create_customer
module: customers
auth:
  role: admin

steps:
  - action: GET
    path: /customers/new
    expect_status: 200

  - action: POST
    path: /customers/new
    body:
      name:    "Testctl Customer"
      country: "GB"
    expect_status: 200   # app responds 200+HTML, not PRG redirect

validations:
  - source: database
    table: customers
    lookup:
      name:      "Testctl Customer"
      tenant_id: 1
    expect:
      name: "Testctl Customer"

teardown_sql:
  - "DELETE FROM customers WHERE name = 'Testctl Customer' AND tenant_id = 1"
