test_case: invoicing_record_payment
module: invoicing
auth:
  role: admin

steps:
  - action: GET
    path: /invoicing/99901
    expect_status: 200

  - action: POST
    path: /invoicing/99901/action
    body:
      action: pay
      amount: "1000"
    expect_status: 200   # app responds 200+HTML, not PRG redirect
