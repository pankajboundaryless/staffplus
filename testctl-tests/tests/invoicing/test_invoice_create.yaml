test_case: invoicing_create_draft_invoice
module: invoicing
auth:
  role: admin

steps:
  - action: GET
    path: /invoicing/new
    expect_status: 200

  - action: POST
    path: /invoicing/new
    body:
      customer_id:  "1"
      project_id:   "14"
      invoice_date: "2026-06-01"
    expect_status: 200   # app responds 200+HTML, not PRG redirect
