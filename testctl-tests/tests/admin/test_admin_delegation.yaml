test_case: settings_create_deputy
module: admin
auth:
  role: admin

steps:
  - action: GET
    path: /settings/deputy/new
    expect_status: 200

  - action: POST
    path: /settings/deputy/new
    body:
      deputy_user_id: "90002"
    expect_status: 200   # app responds 200+HTML, not PRG redirect
