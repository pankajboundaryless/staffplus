test_case: admin_create_role
module: admin
auth:
  role: admin

steps:
  - action: GET
    path: /admin/roles/new
    expect_status: 200

  - action: POST
    path: /admin/roles
    body:
      name: "Testctl Role"
    expect_status: 200   # app responds 200+HTML, not PRG redirect

teardown_sql:
  - "DELETE FROM roles WHERE name = 'Testctl Role' AND tenant_id = 1"
