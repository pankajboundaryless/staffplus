test_case: admin_create_role
module: admin
auth:
  role: admin

steps:
  - action: GET
    path: /admin/roles
    expect_status: 200

  - action: POST
    path: /admin/roles/new
    body:
      label: "Testctl Test Role"
    expect_status: 302

validations:
  - source: database
    table: roles
    lookup:
      tenant_id: 1
      label:     "Testctl Test Role"
    expect:
      is_system: "0"

teardown_sql:
  - "DELETE FROM role_permissions WHERE role_id IN (SELECT id FROM roles WHERE tenant_id = 1 AND label = 'Testctl Test Role')"
  - "DELETE FROM roles WHERE tenant_id = 1 AND label = 'Testctl Test Role'"
