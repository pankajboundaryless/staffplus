test_case: people_create_basic
module: people
auth:
  role: admin

steps:
  - action: GET
    path: /people/new
    expect_status: 200

  - action: POST
    path: /people/new
    body:
      first_name: "Testctl"
      last_name:  "Person"
      email:      "testctl.person@example.test"
    expect_status: 200   # app responds 200+HTML, not PRG redirect

validations:
  - source: database
    table: people
    lookup:
      tenant_id: 1
      email:     "testctl.person@example.test"
    expect:
      first_name: "Testctl"

teardown_sql:
  - "DELETE FROM people WHERE email = 'testctl.person@example.test' AND tenant_id = 1"
