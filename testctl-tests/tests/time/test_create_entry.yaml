test_case: time_create_entry_draft
module: time
auth:
  role: employee

steps:
  - action: GET
    path: /time/book
    expect_status: 200

  - action: POST
    path: /time/store
    body:
      project_id: "14"
      date:       "2026-06-02"
      hours:      "8"
      notes:      "Testctl time entry"
    expect_status: 200   # app responds 200+HTML, not PRG redirect

validations:
  - source: database
    table: time_entries
    lookup:
      tenant_id: 1
      date:      "2026-06-02"
      hours:     8
    order_by: id DESC
    expect:
      hours: 8

teardown_sql:
  - "DELETE FROM time_entries WHERE notes = 'Testctl time entry' AND tenant_id = 1"
