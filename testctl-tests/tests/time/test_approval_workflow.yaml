test_case: time_submit_week_creates_approval
module: time
auth:
  role: employee

setup_sql:
  - "INSERT IGNORE INTO projects (id, tenant_id, name, status, type, created_at) VALUES (99002, 1, 'Testctl Approval Project', 'active', 'billable', NOW())"
  - >
    INSERT IGNORE INTO project_members (project_id, person_id, role, created_at)
    SELECT 99002, p.id, 'member', NOW()
    FROM people p JOIN users u ON u.id = p.user_id
    WHERE u.auth_uid = 90003 AND u.tenant_id = 1
    LIMIT 1
  - >
    INSERT IGNORE INTO time_entries
    (id, tenant_id, project_id, person_id, date_worked, duration, description, status, created_at)
    SELECT 99801, 1, 99002, p.id, '2026-05-04', 8, 'Pre-seeded entry', 'draft', NOW()
    FROM people p JOIN users u ON u.id = p.user_id
    WHERE u.auth_uid = 90003 AND u.tenant_id = 1
    LIMIT 1

steps:
  - action: GET
    path: /time/book
    expect_status: 200

  - action: POST
    path: /time/submit-week
    body:
      week_start: "2026-05-04"
      week_end:   "2026-05-10"
    expect_status: 302

validations:
  - source: database
    table: time_entries
    lookup:
      id: 99801
    expect:
      status: submitted

teardown_sql:
  - "DELETE FROM approval_steps WHERE approval_request_id IN (SELECT id FROM approval_requests WHERE entity_type = 'timesheet' AND tenant_id = 1 AND created_at > DATE_SUB(NOW(), INTERVAL 1 HOUR))"
  - "DELETE FROM approval_requests WHERE entity_type = 'timesheet' AND tenant_id = 1 AND created_at > DATE_SUB(NOW(), INTERVAL 1 HOUR)"
  - "DELETE FROM time_entries WHERE id = 99801"
  - "DELETE FROM project_members WHERE project_id = 99002"
  - "DELETE FROM projects WHERE id = 99002"
