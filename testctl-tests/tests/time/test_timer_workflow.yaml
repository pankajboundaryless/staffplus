test_case: time_timer_start_stop_convert
module: time
auth:
  role: employee

steps:
  - action: GET
    path: /time/timer
    expect_status: 200

  - action: POST
    path: /time/timer/start
    body:
      project_id: "14"
      notes:      "Testctl timer"
    expect_status: 200   # app responds 200+HTML, not PRG redirect

  - action: POST
    path: /time/timer/stop
    body: {}
    expect_status: 200

  - action: POST
    path: /time/timer/convert
    body:
      date:  "2026-06-02"
      hours: "1"
    expect_status: 200   # app responds 200+HTML, not PRG redirect

teardown_sql:
  - "DELETE FROM time_entries WHERE notes = 'Testctl timer' AND tenant_id = 1"
  - "DELETE FROM timers WHERE tenant_id = 1 AND created_at > DATE_SUB(NOW(), INTERVAL 1 HOUR)"
