test_case: projects_create_basic
module: projects
auth:
  role: admin

steps:
  - action: GET
    path: /projects/new
    expect_status: 200

  - action: POST
    path: /projects
    body:
      name:         "Testctl Project"
      customer_id:  "1"
      budget_hours: "80"
      status:       "active"
    expect_status: 200   # app responds 200+HTML, not PRG redirect

validations:
  - source: database
    table: projects
    lookup:
      name:      "Testctl Project"
      tenant_id: 1
    expect:
      name: "Testctl Project"

teardown_sql:
  - "DELETE FROM projects WHERE name = 'Testctl Project' AND tenant_id = 1"
