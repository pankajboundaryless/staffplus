test_case: projects_create_basic
module: projects
auth:
  role: admin

setup_sql:
  - "DELETE FROM projects WHERE name = 'Testctl Project Alpha' AND tenant_id = 1"

steps:
  - action: GET
    path: /projects/new
    expect_status: 200

  - action: POST
    path: /projects/new
    body:
      name:   "Testctl Project Alpha"
      type:   billable
      status: active
    expect_status: 302

validations:
  - source: database
    table: projects
    lookup:
      name:      "Testctl Project Alpha"
      tenant_id: 1
    expect:
      type:   billable
      status: active

teardown_sql:
  - "DELETE FROM project_members WHERE project_id IN (SELECT id FROM projects WHERE name = 'Testctl Project Alpha' AND tenant_id = 1)"
  - "DELETE FROM projects WHERE name = 'Testctl Project Alpha' AND tenant_id = 1"
