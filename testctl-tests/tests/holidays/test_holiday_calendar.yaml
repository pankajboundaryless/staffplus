test_case: holidays_create_calendar_with_entry
module: holidays
auth:
  role: admin

steps:
  - action: GET
    path: /holidays
    expect_status: 200

  - action: POST
    path: /holidays/new
    body:
      name:  "Testctl Holiday Calendar"
      type:  "custom"
      year:  "2026"
      color: "#0D3456"
    follow_redirect: false
    expect_status: 302
    extract:
      - name: calendar_id
        regex: '/holidays/(\d+)'
        from: location_header

  - action: POST
    path: /holidays/{{ calendar_id }}/entry/new
    body:
      date: "2026-08-01"
      name: "Testctl National Day"
    expect_status: 302

validations:
  - source: database
    table: holiday_calendar_sets
    lookup:
      tenant_id: 1
      name:      "Testctl Holiday Calendar"
    expect:
      type: custom

  - source: database
    table: holiday_calendar_entries
    lookup:
      tenant_id: 1
      name:      "Testctl National Day"
    expect:
      date: "2026-08-01"

teardown_sql:
  - "DELETE FROM holiday_calendar_entries WHERE calendar_set_id IN (SELECT id FROM holiday_calendar_sets WHERE tenant_id = 1 AND name = 'Testctl Holiday Calendar')"
  - "DELETE FROM holiday_calendar_sets WHERE tenant_id = 1 AND name = 'Testctl Holiday Calendar'"
