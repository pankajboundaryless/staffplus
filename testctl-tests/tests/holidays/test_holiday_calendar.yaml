test_case: holidays_create_calendar_with_entry
module: holidays
auth:
  role: admin

steps:
  - action: GET
    path: /holidays
    expect_status: 200

  - action: POST
    path: /holidays/new
    body:
      name:    "Testctl Calendar"
      country: "GB"
    expect_status: 200   # app responds 200+HTML, not PRG redirect
