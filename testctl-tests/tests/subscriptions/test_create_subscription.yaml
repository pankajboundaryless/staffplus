test_case: subscriptions_create_subscription
module: subscriptions
auth:
  role: admin

steps:
  - action: GET
    path: /subscriptions/new
    expect_status: 200
    extract:
      - name: first_customer_id
        selector: "select[name='customer_id'] option:not([value=''])"
        attribute: value

  - action: POST
    path: /subscriptions/new
    body:
      customer_id:             "{{ first_customer_id }}"
      name:                    "Testctl Monthly Retainer"
      start_date:              "2026-06-01"
      billing_interval_value:  "1"
      billing_interval_unit:   "month"
      currency:                "CHF"
      status:                  "active"
    expect_status: 302

validations:
  - source: database
    table: subscriptions
    lookup:
      tenant_id: 1
      name:      "Testctl Monthly Retainer"
    order_by: id DESC
    expect:
      status:   active
      currency: CHF

teardown_sql:
  - "DELETE FROM subscription_lines WHERE subscription_id IN (SELECT id FROM subscriptions WHERE tenant_id = 1 AND name = 'Testctl Monthly Retainer')"
  - "DELETE FROM subscriptions WHERE tenant_id = 1 AND name = 'Testctl Monthly Retainer'"
