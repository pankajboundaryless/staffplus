test_case: subscriptions_create_subscription
module: subscriptions
auth:
  role: admin

steps:
  - action: GET
    path: /subscriptions/new
    expect_status: 200

  - action: POST
    path: /subscriptions/new
    body:
      customer_id: "1"
      product_id:  "1"
    expect_status: 200   # app responds 200+HTML, not PRG redirect
