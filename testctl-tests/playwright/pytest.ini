[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    --tb=short
    --html=reports/report.html
    --self-contained-html
    -p no:warnings
    -p conftest_report
markers =
    slow: marks tests as slow
    security: marks tests as security-related
