[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "testctl"
version = "0.1.0"
description = "Boundaryless Test Control Engine"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "mariadb>=1.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
dev = ["pytest>=7", "pytest-cov"]

[project.scripts]
testctl = "testctl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["testctl*"]
